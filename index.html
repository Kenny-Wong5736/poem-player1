:root{--g:#66816b;--bg:#f5f0e6;--paper:#fffdf8;--ink:#2f3934}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(135deg,#eaf2ec,#f6ecdf);color:var(--ink);font-family:"Songti SC","STSong",serif;-webkit-tap-highlight-color:transparent}.top{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:max(12px,env(safe-area-inset-top)) 14px 12px;background:#fffdf8ee;backdrop-filter:blur(12px)}button,input,select{min-height:44px;border:1px solid #ccd5ce;border-radius:12px;background:white;padding:8px 12px;font-size:16px}h1{font-size:20px;margin:0}.search{margin-left:auto;width:min(300px,34vw)}.page{min-height:calc(100dvh - 70px);display:grid;place-items:center;padding:14px}.card{width:min(800px,100%);min-height:620px;background:var(--paper);border-radius:26px;padding:34px;text-align:center;box-shadow:0 15px 38px #30403620;display:flex;flex-direction:column}.count,.status{font:13px sans-serif;color:#758078}.title{font-size:34px;margin:16px 0 7px}.meta{color:#806c4c}.text{white-space:pre-line;font-size:25px;line-height:2;letter-spacing:2px;margin:auto}.controls{position:sticky;bottom:0;display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:10px 0 max(8px,env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--paper) 22%)}.primary{background:var(--g);color:white}.progress{width:100%;accent-color:var(--g)}.row{display:flex;gap:8px;align-items:center;justify-content:center;font:14px sans-serif}.shade{position:fixed;inset:0;background:#0005;z-index:20;display:none}.shade.on{display:block}.drawer{position:fixed;left:0;top:0;bottom:0;width:min(360px,88vw);background:var(--paper);z-index:30;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));transform:translateX(-105%);transition:.25s;display:flex;flex-direction:column}.drawer.on{transform:none}.list{overflow:auto}.list button{width:100%;display:block;text-align:left;border:0;background:transparent}.list button.active{background:var(--g);color:white}.close{float:right}@media(max-width:650px){.top{flex-wrap:wrap}.search{order:3;width:100%;margin:0}.page{height:calc(100dvh - 112px);min-height:0;overflow:auto;align-items:start;padding:10px}.card{min-height:100%;border-radius:20px;padding:20px 14px 8px}.title{font-size:29px}.text{font-size:clamp(20px,6vw,25px);line-height:1.9;letter-spacing:1px}.controls button{flex:1 1 30%;min-height:48px}}
</style></head><body><header class="top"><button id="menu">☰</button><h1>古诗朗读 V4.0</h1><input id="search" class="search" placeholder="搜索诗名、作者、朝代或诗句"></header><main class="page"><article class="card"><div id="count" class="count"></div><h2 id="title" class="title"></h2><div id="meta" class="meta"></div><div id="text" class="text"></div><div class="row"><span id="now">00:00</span><input id="progress" class="progress" type="range" min="0" max="100" value="0"><span id="duration">00:00</span></div><div class="controls"><button id="prev">上一首</button><button id="play" class="primary">▶ 播放</button><button id="next">下一首</button><button id="restart">从头播放</button><button id="loop">列表循环：开</button></div><div id="status" class="status">MP3模式：首次请点击播放以启用后台音频。</div></article></main><audio id="player" preload="metadata"></audio><div id="shade" class="shade"></div><aside id="drawer" class="drawer"><div><h2 style="display:inline">古诗目录</h2><button id="close" class="close">×</button></div><input id="dsearch" placeholder="目录中搜索"><nav id="list" class="list"></nav></aside><script>
const poems=[{"title": "悯农（其二）", "dynasty": "唐", "author": "李绅", "text": "锄禾日当午，\n汗滴禾下土。\n谁知盘中餐，\n粒粒皆辛苦。", "audio": "audio/01.mp3"}, {"title": "池上", "dynasty": "唐", "author": "白居易", "text": "小娃撑小艇，\n偷采白莲回。\n不解藏踪迹，\n浮萍一道开。", "audio": "audio/02.mp3"}, {"title": "小池", "dynasty": "宋", "author": "杨万里", "text": "泉眼无声惜细流，\n树阴照水爱晴柔。\n小荷才露尖尖角，\n早有蜻蜓立上头。", "audio": "audio/03.mp3"}, {"title": "小儿垂钓", "dynasty": "唐", "author": "胡令能", "text": "蓬头稚子学垂纶，\n侧坐莓苔草映身。\n路人借问遥招手，\n怕得鱼惊不应人。", "audio": "audio/04.mp3"}, {"title": "江雪", "dynasty": "唐", "author": "柳宗元", "text": "千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。", "audio": "audio/05.mp3"}, {"title": "敕勒歌", "dynasty": "北朝民歌", "author": "佚名", "text": "敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，\n风吹草低见牛羊。", "audio": "audio/06.mp3"}, {"title": "村居", "dynasty": "清", "author": "高鼎", "text": "草长莺飞二月天，\n拂堤杨柳醉春烟。\n儿童散学归来早，\n忙趁东风放纸鸢。", "audio": "audio/07.mp3"}, {"title": "悯农（其一）", "dynasty": "唐", "author": "李绅", "text": "春种一粒粟，\n秋收万颗子。\n四海无闲田，\n农夫犹饿死。", "audio": "audio/08.mp3"}, {"title": "所见", "dynasty": "清", "author": "袁枚", "text": "牧童骑黄牛，\n歌声振林樾。\n意欲捕鸣蝉，\n忽然闭口立。", "audio": "audio/09.mp3"}, {"title": "元日", "dynasty": "宋", "author": "王安石", "text": "爆竹声中一岁除，\n春风送暖入屠苏。\n千门万户曈曈日，\n总把新桃换旧符。", "audio": "audio/10.mp3"}, {"title": "清明", "dynasty": "唐", "author": "杜牧", "text": "清明时节雨纷纷，\n路上行人欲断魂。\n借问酒家何处有？\n牧童遥指杏花村。", "audio": "audio/11.mp3"}, {"title": "九月九日忆山东兄弟", "dynasty": "唐", "author": "王维", "text": "独在异乡为异客，\n每逢佳节倍思亲。\n遥知兄弟登高处，\n遍插茱萸少一人。", "audio": "audio/12.mp3"}, {"title": "四时田园杂兴（其二十五）", "dynasty": "宋", "author": "范成大", "text": "梅子金黄杏子肥，\n麦花雪白菜花稀。\n日长篱落无人过，\n惟有蜻蜓蛱蝶飞。", "audio": "audio/13.mp3"}, {"title": "渔歌子", "dynasty": "唐", "author": "张志和", "text": "西塞山前白鹭飞，\n桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，\n斜风细雨不须归。", "audio": "audio/14.mp3"}, {"title": "四时田园杂兴（其三十一）", "dynasty": "宋", "author": "范成大", "text": "昼出耘田夜绩麻，\n村庄儿女各当家。\n童孙未解供耕织，\n也傍桑阴学种瓜。", "audio": "audio/15.mp3"}, {"title": "乡村四月", "dynasty": "宋", "author": "翁卷", "text": "绿遍山原白满川，\n子规声里雨如烟。\n乡村四月闲人少，\n才了蚕桑又插田。", "audio": "audio/16.mp3"}, {"title": "长歌行", "dynasty": "汉乐府", "author": "佚名", "text": "青青园中葵，朝露待日晞。\n阳春布德泽，万物生光辉。\n常恐秋节至，焜黄华叶衰。\n百川东到海，何时复西归？\n少壮不努力，老大徒伤悲！", "audio": "audio/17.mp3"}, {"title": "江上渔者", "dynasty": "宋", "author": "范仲淹", "text": "江上往来人，\n但爱鲈鱼美。\n君看一叶舟，\n出没风波里。", "audio": "audio/18.mp3"}],$=id=>document.getElementById(id),audio=$('player');let i=0,q='',loop=true;
function fmt(s){if(!isFinite(s))return'00:00';s=Math.floor(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function norm(x){return String(x).replace(/\s/g,'').toLowerCase()}
function renderList(){const v=norm(q);$('list').innerHTML='';poems.forEach((p,n)=>{if(v&&!norm(p.title+p.author+p.dynasty+p.text).includes(v))return;const b=document.createElement('button');b.textContent=`${n+1}. ${p.title} · ${p.author}`;b.classList.toggle('active',n===i);b.onclick=()=>{select(n,true);drawer(false)};$('list').appendChild(b)})}
function render(){const p=poems[i];$('count').textContent=`第 ${i+1} 首 / 共 ${poems.length} 首`;$('title').textContent=p.title;$('meta').textContent=`${p.dynasty} · ${p.author}`;$('text').textContent=p.text;renderList();updateSession()}
function drawer(on){$('drawer').classList.toggle('on',on);$('shade').classList.toggle('on',on)}
function select(n,autoplay=false){i=(n+poems.length)%poems.length;audio.src=poems[i].audio;audio.load();render();if(autoplay)audio.play().catch(showTap)}
function showTap(){$('status').textContent='请点击一次播放按钮，允许浏览器启动音频。'}
function toggle(){if(audio.paused)audio.play().catch(showTap);else audio.pause()}
function updateSession(){if(!('mediaSession'in navigator))return;const p=poems[i];navigator.mediaSession.metadata=new MediaMetadata({title:p.title,artist:`${p.dynasty} · ${p.author}`,album:'古诗朗读 V4.0',artwork:[{src:'icon-192.png',sizes:'192x192',type:'image/png'},{src:'icon-512.png',sizes:'512x512',type:'image/png'}]})}
audio.onplay=()=>{$('play').textContent='❚❚ 暂停';$('status').textContent='正在播放：'+poems[i].title;if('mediaSession'in navigator)navigator.mediaSession.playbackState='playing'};audio.onpause=()=>{$('play').textContent='▶ 播放';if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused'};audio.ontimeupdate=()=>{$('progress').value=audio.duration?audio.currentTime/audio.duration*100:0;$('now').textContent=fmt(audio.currentTime);$('duration').textContent=fmt(audio.duration)};audio.onended=()=>{if(i<poems.length-1)select(i+1,true);else if(loop)select(0,true)};audio.onerror=()=>{$('status').textContent='音频加载失败，请确认 audio 文件夹与网页在同一目录。'};
$('progress').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};$('play').onclick=toggle;$('prev').onclick=()=>select(i-1,true);$('next').onclick=()=>select(i+1,true);$('restart').onclick=()=>{audio.currentTime=0;audio.play().catch(showTap)};$('loop').onclick=()=>{loop=!loop;$('loop').textContent='列表循环：'+(loop?'开':'关')};$('menu').onclick=()=>drawer(true);$('close').onclick=()=>drawer(false);$('shade').onclick=()=>drawer(false);$('search').oninput=e=>{q=e.target.value;$('dsearch').value=q;renderList()};$('dsearch').oninput=e=>{q=e.target.value;$('search').value=q;renderList()};
if('mediaSession'in navigator){for(const [a,h] of Object.entries({play:()=>audio.play(),pause:()=>audio.pause(),previoustrack:()=>select(i-1,true),nexttrack:()=>select(i+1,true),stop:()=>{audio.pause();audio.currentTime=0},seekbackward:d=>audio.currentTime=Math.max(0,audio.currentTime-(d.seekOffset||10)),seekforward:d=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+(d.seekOffset||10))}))try{navigator.mediaSession.setActionHandler(a,h)}catch(e){}}
select(0,false);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js');
</script></body></html>
